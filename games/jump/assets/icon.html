<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>jump icon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }
      #icon {
        width: 600px;
        height: 600px;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 图标源文件：改完用 node scripts/make-assets.mjs 重新导出 PNG -->
    <svg id="icon" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#0d0f24" />
          <stop offset="55%" stop-color="#241a3f" />
          <stop offset="100%" stop-color="#3a2350" />
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6b5bb5" />
          <stop offset="100%" stop-color="#332a63" />
        </linearGradient>
        <linearGradient id="cube" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#ffe08a" />
          <stop offset="100%" stop-color="#f2b134" />
        </linearGradient>
      </defs>

      <rect width="600" height="600" fill="url(#bg)" />

      <g fill="#ffffff">
        <circle cx="92" cy="96" r="5" opacity="0.5" />
        <circle cx="160" cy="60" r="3" opacity="0.35" />
        <circle cx="486" cy="120" r="4" opacity="0.45" />
        <circle cx="530" cy="78" r="3" opacity="0.3" />
        <circle cx="70" cy="250" r="3" opacity="0.3" />
        <circle cx="520" cy="250" r="4" opacity="0.4" />
        <circle cx="420" cy="62" r="3" opacity="0.3" />
      </g>

      <circle cx="300" cy="330" r="210" fill="url(#glow)" />

      <path
        d="M 96 420 Q 300 120 504 420"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.22"
        stroke-width="10"
        stroke-linecap="round"
        stroke-dasharray="2 34"
      />

      <rect x="96" y="432" width="408" height="120" rx="26" fill="url(#plat)" />
      <rect x="112" y="442" width="376" height="9" rx="4.5" fill="#a78bfa" opacity="0.85" />

      <ellipse cx="300" cy="436" rx="86" ry="16" fill="#000000" opacity="0.35" />

      <rect x="212" y="252" width="176" height="176" rx="42" fill="url(#cube)" />
      <rect x="232" y="272" width="136" height="34" rx="17" fill="#ffffff" opacity="0.28" />

      <rect x="262" y="322" width="24" height="40" rx="12" fill="#241a3f" />
      <rect x="314" y="322" width="24" height="40" rx="12" fill="#241a3f" />

      <rect x="286" y="386" width="28" height="10" rx="5" fill="#241a3f" opacity="0.75" />
    </svg>
  </body>
</html>
